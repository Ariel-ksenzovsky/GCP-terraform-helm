name: Clean Up Docker Images and S3 Files

on:
  workflow_dispatch: # Manual trigger

jobs:
  delete_old_docker_images:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Docker Hub Repository Tags
        id: fetch-tags
        run: |
          REPO="arielk2511/star_meme_sql_compose"  # Change to your Docker Hub repo

          echo "Fetching Docker tags for $REPO..."
          tags=$(curl -s -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
            "https://hub.docker.com/v2/repositories/$REPO/tags?page_size=100" | jq -r '.results[] | "\(.name) \(.tag_last_pushed)"')

          current_date=$(date +%s)
          cutoff_date=$(date -d '30 days ago' +%s)

          for tag_info in $tags; do
            tag=$(echo $tag_info | awk '{print $1}')
            pushed_date=$(echo $tag_info | awk '{print $2}')
            pushed_timestamp=$(date -d "$pushed_date" +%s)

            if [[ $pushed_timestamp -lt $cutoff_date ]]; then
              echo "Deleting old image tag: $tag (pushed on $pushed_date)"
              curl -X DELETE -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
                "https://hub.docker.com/v2/repositories/$REPO/tags/$tag/"
            fi
          done

  delete_old_s3_files:
    runs-on: ubuntu-latest
    needs: delete_old_docker_images
    steps:
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Delete Files Older Than 30 Days from S3
        run: |
          echo "Deleting files older than 30 days from S3..."
          aws s3 ls s3://${{ secrets.AWS_BUCKET_NAME }}/ --recursive | while read line; do
            file_date=$(echo $line | awk '{print $1" "$2}')
            file_path=$(echo $line | awk '{print $4}')
            file_timestamp=$(date -d "$file_date" +%s)
            cutoff_date=$(date -d '30 days ago' +%s)

            if [[ $file_timestamp -lt $cutoff_date ]]; then
              echo "Deleting: $file_path (Last modified: $file_date)"
              aws s3 rm s3://${{ secrets.AWS_BUCKET_NAME }}/$file_path
            fi
          done
