name: Cleanup Old Images and Helm Charts

on:
  workflow_dispatch:
    inputs:
      retention_days:
        description: 'Number of days to retain images and charts'
        required: true
        type: number

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Docker Hub login
        run: |
          echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Cleanup Docker Hub Images
        run: |
          # Docker Hub credentials
          retention_days="${{ github.event.inputs.retention_days }}"

          # Get the list of repositories (images) from Docker Hub
          repos=$(curl -s -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
            "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/?page_size=100" \
            | jq -r '.results[].name')

          for repo in $repos; do
            echo "Cleaning up images from repository: $repo"

            # Get image tags older than the retention threshold
            tags=$(curl -s -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
              "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/${repo}/tags/?page_size=100" \
              | jq -r ".results[] | select(.last_updated | sub(\"\\.[0-9]+Z$\"; \"Z\") | fromdateiso8601 < $(date -d "$retention_days days ago" +%s)) | .name")

            for tag in $tags; do
              echo "Deleting tag: $tag from repository: $repo"
              curl -s -X DELETE -u "${{ secrets.DOCKER_USERNAME }}:${{ secrets.DOCKER_PASSWORD }}" \
                "https://hub.docker.com/v2/repositories/${{ secrets.DOCKER_USERNAME }}/${repo}/tags/${tag}/"
            done
          done

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Cleanup Helm Charts from S3 Bucket
        run: |
          # Set the retention threshold in days
          retention_days="${{ github.event.inputs.retention_days }}"

          # List Helm charts in the S3 bucket
          charts=$(aws s3 ls s3://your-helm-charts-bucket/ --recursive | awk '{print $4, $1}')

          for chart in $charts; do
            chart_name=$(echo $chart | awk '{print $1}')
            chart_date=$(echo $chart | awk '{print $2}')
            chart_timestamp=$(date -d "$chart_date" +%s)
            threshold_timestamp=$(date -d "$retention_days days ago" +%s)

            if [ $chart_timestamp -lt $threshold_timestamp ]; then
              echo "Deleting old chart: $chart_name"
              aws s3 rm s3://your-helm-charts-bucket/$chart_name
            fi
          done
